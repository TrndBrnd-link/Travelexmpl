<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=0">
<title>رحلاتي | قارن واحجز رحلات الطيران من العراق</title>
<meta name="description" content="رحلاتي — قارن أسعار رحلات الطيران من عشرات مكاتب السفر العراقية واحجز مباشرة عبر واتساب.">
<meta name="theme-color" content="#0E3B3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><rect width=%2264%22 height=%2264%22 rx=%2216%22 fill=%22%230E3B3E%22/><text x=%2232%22 y=%2242%22 font-size=%2230%22 text-anchor=%22middle%22 fill=%22%23D8973F%22 font-family=%22Arial%22 font-weight=%22bold%22>ر</text></svg>">
</head>
<body>

  <!-- App bar -->
  <header class="appbar" id="appbar">
    <div class="appbar__brand">
      <span class="appbar__mark">ر</span>
      <span class="appbar__name">رحلاتي</span>
    </div>
    <button type="button" class="appbar__trips" id="appbar-trips" aria-label="حجوزاتي">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7h-3V5a2 2 0 0 0-2-2H9a2 2 0 0 0-2 2v2H4a1 1 0 0 0-1 1v11a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8a1 1 0 0 0-1-1ZM9 5h6v2H9Z"/></svg>
      <span class="appbar__badge" id="trips-badge">0</span>
    </button>
  </header>

  <!-- Hero + search -->
  <section class="hero">
    <p class="hero__kicker">سافر من العراق إلى العالم</p>
    <h1 class="hero__title">إلى وين نسافر اليوم؟</h1>
    <p class="hero__sub">قارن أسعار عشرات مكاتب السفر العراقية واحجز مباشرة عبر واتساب</p>
  </section>

  <div class="searchcard">
    <div class="triptype">
      <button type="button" data-type="oneway">ذهاب فقط</button>
      <button type="button" data-type="roundtrip" class="is-active">ذهاب وعودة</button>
    </div>

    <div class="route">
      <div class="route__field">
        <svg class="route__icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 19.5 21 12 2.5 4.5 4 11l11 1-11 1z"/></svg>
        <div class="route__input-wrap">
          <label for="field-from">من</label>
          <input type="text" id="field-from" class="route__value" placeholder="اختر مدينة الانطلاق" autocomplete="off">
          <div class="suggest" id="suggest-from"></div>
        </div>
      </div>
      <div class="route__field">
        <svg class="route__icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="10" r="3"/><path d="M12 21s7-6.5 7-11a7 7 0 1 0-14 0c0 4.5 7 11 7 11Z"/></svg>
        <div class="route__input-wrap">
          <label for="field-to">إلى</label>
          <input type="text" id="field-to" class="route__value" placeholder="اختر وجهتك" autocomplete="off">
          <div class="suggest" id="suggest-to"></div>
        </div>
      </div>
      <button type="button" class="swap" id="swap-btn" aria-label="تبديل الوجهتين">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h13l-4-4M17 17H4l4 4"/></svg>
      </button>
    </div>

    <div class="searchcard__row" id="return-field-wrap">
      <div class="route">
        <div class="route__field">
          <svg class="route__icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>
          <div class="route__input-wrap">
            <label for="field-date">تاريخ المغادرة</label>
            <input type="date" id="field-date" class="route__value">
          </div>
        </div>
      </div>
    </div>

    <div class="searchcard__row">
      <div class="route">
        <div class="route__field">
          <svg class="route__icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 20v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="10" cy="6" r="4"/></svg>
          <div class="route__input-wrap">
            <label>المسافرون</label>
            <div class="stepper">
              <button type="button" id="pax-minus">−</button>
              <span class="stepper__count" id="pax-count">1</span>
              <button type="button" id="pax-plus">+</button>
              <span style="font-size:12px;color:var(--ink-soft)">مسافر</span>
            </div>
          </div>
        </div>
      </div>
      <div class="route">
        <div class="route__field">
          <svg class="route__icon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
          <div class="route__input-wrap">
            <label for="cabin-select">الدرجة</label>
            <select id="cabin-select" class="route__value">
              <option value="economy">اقتصادية</option>
              <option value="business">رجال أعمال</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <button type="button" class="searchbtn" id="search-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <span class="searchbtn__label">ابحث عن رحلات</span>
      <span class="searchbtn__spinner"><span></span><span></span><span></span></span>
    </button>
  </div>

  <!-- Trending destinations -->
  <section class="section">
    <div class="section__head">
      <h2 class="section__title">وجهات رائجة من العراق</h2>
      <span class="section__hint">اضغط للبحث السريع</span>
    </div>
    <div class="trend-scroll" id="trend-scroll"></div>
  </section>

  <!-- Results -->
  <section class="section" id="results-section" hidden>
    <div class="results__meta">
      <p class="results__count" id="results-count"></p>
    </div>
    <div class="sortbar">
      <button type="button" class="chip is-active" data-sort="best">الأنسب</button>
      <button type="button" class="chip" data-sort="cheapest">الأرخص</button>
      <button type="button" class="chip" data-sort="fastest">الأسرع</button>
      <button type="button" class="chip" data-sort="earliest">الأبكر</button>
    </div>
    <ul class="flightlist" id="results-list"></ul>
  </section>

  <!-- Bottom navigation -->
  <nav class="bottomnav">
    <button type="button" class="is-active" id="nav-search">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      بحث
    </button>
    <button type="button" id="nav-trips">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7h-3V5a2 2 0 0 0-2-2H9a2 2 0 0 0-2 2v2H4a1 1 0 0 0-1 1v11a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8a1 1 0 0 0-1-1ZM9 5h6v2H9Z"/></svg>
      حجوزاتي
      <span class="bottomnav__dot" id="nav-trips-dot"></span>
    </button>
  </nav>

  <!-- Trips side panel -->
  <div class="scrim" id="scrim"></div>
  <aside class="panel" id="trips-panel" aria-label="حجوزاتي">
    <div class="panel__head">
      <h2 class="panel__title">حجوزاتي</h2>
      <button type="button" class="panel__close" id="panel-close" aria-label="إغلاق">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="panel__body" id="panel-body"></div>
  </aside>

  <div class="toast" id="toast"></div>

  <script src="js/app.js"></script>
</body>
</html>
